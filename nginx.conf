server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Handle assets with caching
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000";
    }
}
